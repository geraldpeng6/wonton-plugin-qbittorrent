[BitTorrent]
Session\DefaultSavePath=/downloads
Session\Port=51413
Session\TempPath=/downloads/temp
Session\TempPathEnabled=true

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=8

[Network]
PortForwardingEnabled=false

[Preferences]
Connection\PortRangeMin=51413
Connection\PortRangeMax=51413
Connection\UPnP=false
Downloads\SavePath=/downloads
Downloads\TempPath=/downloads/temp
General\Locale=zh_CN
WebUI\Address=*
WebUI\AuthSubnetWhitelist=__WONTON_CORE_ADDRESS__/32
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\CSRFProtection=true
# 网关保留公开 Host（含核心端口），与容器监听端口不同；关闭该检查避免误拒网关请求。
WebUI\HostHeaderValidation=false
WebUI\LocalHostAuth=true
# 不信任 X-Forwarded-For；网关连接来源就是白名单中的核心地址。
WebUI\ReverseProxySupportEnabled=false
WebUI\ServerDomains=*
WebUI\UseUPnP=false
